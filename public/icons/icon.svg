<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8a1f33" />
      <stop offset="100%" stop-color="#4e0e1c" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f6d38b" />
      <stop offset="100%" stop-color="#c9983e" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- Container Box -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />
  <rect width="496" height="496" x="8" y="8" rx="104" stroke="url(#goldGrad)" stroke-width="6" opacity="0.4" />

  <!-- Shield -->
  <g filter="url(#shadow)">
    <path d="M256 96 L376 136 C376 272 256 384 256 408 C256 384 136 272 136 136 Z" 
          fill="#ffffff" 
          stroke="url(#goldGrad)" 
          stroke-width="10" 
          stroke-linejoin="round" />
  </g>

  <!-- Balance Bar & Scales of Justice -->
  <path d="M216 180 L296 180" stroke="#7a1c2e" stroke-width="8" stroke-linecap="round" />
  <circle cx="256" cy="164" r="6" fill="#c9983e" />
  <path d="M256 164 L256 210" stroke="#7a1c2e" stroke-width="6" />

  <!-- Verification Checkmark (Asistencia / Cumplimiento) -->
  <path d="M208 274 L244 310 L308 238" 
        stroke="#7a1c2e" 
        stroke-width="16" 
        stroke-linecap="round" 
        stroke-linejoin="round" />
</svg>
