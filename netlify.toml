[build]
  command = "npm run build"
  publish = "dist"

# Proxy de la API REST hacia el backend (elimina problemas de CORS y devuelve JSON real)
[[redirects]]
  from = "/api/*"
  to = "https://sitrad.cortedelsanta.com/api/:splat"
  status = 200
  force = true

# Enrutamiento SPA para React Router (cualquier otra ruta va a index.html)
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
